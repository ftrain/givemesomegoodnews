# The Give Me Some Good News catalog: local newsrooms built on models that answer to
# readers and communities — nonprofits, worker-owned cooperatives, family
# and community papers, public media — not private equity.
#
# Sources for inclusion: the newsrooms Paul named; the Lenfest Institute's
# Beyond Print cohort; the American Journalism Project portfolio
# (https://www.theajp.org/portfolio/); RJI's survey of non-traditional
# newsrooms; and the well-known independents of this movement.
#
# Fields: slug, name, url are required. about_url/feed_url are hints —
# the fetchers autodiscover when they're missing or wrong. lat/lon place
# the dot on the map (statewide outlets are plotted at their home city).
# about_text is NOT stored here: it is fetched from each org's own About
# page so the catalog stays in their words.

