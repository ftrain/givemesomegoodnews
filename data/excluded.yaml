# Never import these, whatever a directory files them under.
#
# The Media and Democracy Project labels the Inquirer, the Sun-Times and the
# Salt Lake Tribune "Nonprofit", which is true — Lenfest, Chicago Public
# Media and a 501(c)(3) conversion respectively — so an ownership rule lets
# them straight back in. They are metro dailies, and the site is about local
# newsrooms. Matched on host, so a re-import cannot resurrect them.

