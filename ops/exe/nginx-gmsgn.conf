# givemesomegood.news on exe.dev — 2026-09-11, from the live vhost on
# 45.55.79.44, with THREE changes and no others:
#   1. no ssl_* / listen 443 — the exe.dev edge terminates TLS and speaks
#      plain HTTP to this box.
#   2. the :80 -> https redirect server block is DELETED. The edge already
#      serves only HTTPS, so that block would have redirected a request that
#      had already arrived over TLS, in a loop.
#   3. absolute_redirect off — nginx builds absolute URLs from the scheme it
#      was spoken to on, which is http here; a Location of http:// is refused
#      by the browser as mixed content. See docs/EXE-MIGRATION.md.
# The rate-limit zones, the AI-crawler refusal map, the CSP snippet, every
# cache header and every try_files are the live file's, untouched.
# givemesomegood.news — static HTML plus one small search service.
# Cheap to run: everything but /search is a file on disk.

# Rate limits. Reading is generous; search costs a database query, so it is
# metered separately and much tighter.
limit_req_zone  $binary_remote_addr zone=gmsgn_read:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=gmsgn_search:10m rate=1r/s;
# RSS is what a scraper would hammer: it is the whole feed in one cheap
# request. Real readers poll every few minutes at most.
limit_req_zone  $binary_remote_addr zone=gmsgn_rss:10m    rate=12r/m;
limit_req_zone  $binary_remote_addr zone=gmsgn_pages:10m  rate=8r/s;
limit_conn_zone $binary_remote_addr zone=gmsgn_conn:10m;

# The AI crawlers are asked to leave in robots.txt; this is the part that
# does not depend on them being polite. The reporting is not ours to give.
map $http_user_agent $gmsgn_refused {
    default 0;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|PerplexityBot|Perplexity-User|Bytespider|Amazonbot|meta-externalagent|FacebookBot|Applebot-Extended|Diffbot|omgili|omgilibot|ImagesiftBot|DataForSeoBot|SemrushBot|AhrefsBot|MJ12bot|DotBot|ZoominfoBot|Timpibot|Webzio)" 1;
}

# (THE www -> APEX REDIRECT BLOCK STOOD HERE and is disabled, 2026-09-11.
#  Behind the exe.dev edge each hostname needs its own registered certificate,
#  and while the apex was unregistered this block bounced every working www
#  request onto a name whose TLS handshake failed — so a site that was half up
#  looked entirely down. The main block below answers for both names.)
server {
    # DEFAULT_SERVER, AND THE HOSTNAME IS LISTED (2026-09-11). The edge sends
    # Host: givemesomegood.exe.xyz, which matches neither of this file's
    # server_names — so without a default the www->apex redirect block above
    # caught every request and answered 301 to everything, including the
    # homepage. The live box never had this problem because TLS SNI picked the
    # block; behind the exe proxy there is no SNI to pick with.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name givemesomegood.news givemesomegood.exe.xyz _;


    root /srv/givemesomegoodnews/app/site;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/givemesomegood.access.log;
    error_log  /var/log/nginx/givemesomegood.error.log;

    if ($gmsgn_refused) { return 403; }

    limit_req  zone=gmsgn_read burst=60 nodelay;
    limit_conn gmsgn_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/rss+xml
               application/xml image/svg+xml application/javascript;


    # Content-addressed: the bytes behind a given name never change.
    #
    # Pictures live in site/img/<first two of the name>/<name>. Both spellings
    # are served either way round, so a page built before the cache was spread
    # out — or a link someone kept — still resolves while the two layouts
    # overlap, without a redirect.
    location ~ "^/img/(?<shard>[0-9a-f]{2})/(?<picture>[0-9a-f]+\.(?:webp|jpg))$" {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, noimageindex" always;
        try_files $uri /img/$picture =404;
    }
    location ~ "^/img/(?<head>[0-9a-f]{2})(?<tail>[0-9a-f]+\.(?:webp|jpg))$" {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, noimageindex" always;
        try_files /img/$head/$head$tail $uri =404;
    }
    location /img/ {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, noimageindex" always;
        try_files $uri =404;
    }
    # The stylesheet carries its own hash in its name, so the bytes behind
    # any one name never change: keep it for a year, like the pictures and
    # the fonts. A changed rule arrives as a different name.
    location ~ "^/style\.[0-9a-f]+\.css$" {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Feed management. Metered hard and never indexed.
    location /admin {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location = /search.xml {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_rss burst=4 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # The one dynamic route, and the only one worth metering hard.
    location /search {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_search burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # The plain-text edition is static; keep it out of the index all the same.
    location /text/ {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.xml$ {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_rss burst=6 nodelay;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Robots-Tag "noindex" always;
        types { } default_type application/rss+xml;
        try_files $uri =404;
    }

    location = /catalog.json {
        include snippets/gmsgn-security.conf;
        # The export is written beside the data it comes from, not into the
        # served directory, so it needs naming: without this the request looked
        # for it under the site root and 404ed.
        alias /srv/givemesomegoodnews/app/data/catalog.json;
        limit_req zone=gmsgn_rss burst=4 nodelay;
        add_header Cache-Control "public, max-age=900" always;
        default_type application/json;
    }

    location = /robots.txt { add_header Cache-Control "public, max-age=3600" always; }
    location = /favicon.svg { add_header Cache-Control "public, max-age=604800" always; }

    # Feed pages and subject pages are the newsrooms' work: readable, not indexable.
    location ~ ^/(feed-|subjects/) {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html =404;
    }

    location / {
        include snippets/gmsgn-security.conf;
        # Short max-age plus nginx's ETag: a rebuild is picked up on the next
        # revalidation, and an unchanged page costs a 304.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}