# givemesomegood.news STAGING on exe.dev — https://givemesomegood.exe.xyz:8100/
# (2026-09-14). Generated from nginx-gmsgn.conf, whose http-level rate-limit
# zones and crawler map it reuses by name (defining them twice is an nginx
# error): port 8100, the staging checkout's site/, search on :8083, admin on
# :8084, its own logs. exe.dev shows ports 3000-9999 only to people with access
# to the VM. site/img/ in the staging checkout is a link to production's.

server {
    # DEFAULT_SERVER, AND THE HOSTNAME IS LISTED (2026-09-11). The edge sends
    # Host: givemesomegood.exe.xyz, which matches neither of this file's
    # server_names — so without a default the www->apex redirect block above
    # caught every request and answered 301 to everything, including the
    # homepage. The live box never had this problem because TLS SNI picked the
    # block; behind the exe proxy there is no SNI to pick with.
    listen 8100 default_server;
    listen [::]:8100 default_server;
    server_name _;


    root /srv/givemesomegoodnews/app-staging/site;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/givemesomegood-staging.access.log;
    error_log  /var/log/nginx/givemesomegood-staging.error.log;

    if ($gmsgn_refused) { return 403; }

    limit_req  zone=gmsgn_read burst=60 nodelay;
    limit_conn gmsgn_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/rss+xml
               application/xml image/svg+xml application/javascript;


    # Content-addressed: the bytes behind a given name never change.
    location /img/ {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, noimageindex" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include snippets/gmsgn-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Feed management. Metered hard and never indexed.
    location /admin {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location = /search.xml {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_rss burst=4 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # The one dynamic route, and the only one worth metering hard.
    location /search {
        include snippets/gmsgn-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=gmsgn_search burst=5 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # The plain-text edition is static; keep it out of the index all the same.
    location /text/ {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.xml$ {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_rss burst=6 nodelay;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Robots-Tag "noindex" always;
        types { } default_type application/rss+xml;
        try_files $uri =404;
    }

    location = /catalog.json {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_rss burst=4 nodelay;
        add_header Cache-Control "public, max-age=900" always;
        default_type application/json;
    }

    location = /robots.txt { add_header Cache-Control "public, max-age=3600" always; }
    location = /favicon.svg { add_header Cache-Control "public, max-age=604800" always; }

    # Feed pages and subject pages are the newsrooms' work: readable, not indexable.
    location ~ ^/(feed-|subjects/) {
        include snippets/gmsgn-security.conf;
        limit_req zone=gmsgn_pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html =404;
    }

    location / {
        include snippets/gmsgn-security.conf;
        # Short max-age plus nginx's ETag: a rebuild is picked up on the next
        # revalidation, and an unchanged page costs a 304.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}