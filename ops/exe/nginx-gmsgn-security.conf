# The security headers, included by both vhosts (production and staging) at
# every location. It was the box's own file until 2026-09-21, when the CSP it
# carries turned out to be blocking the stylesheet: it lives here now, and the
# deploy installs it, so a change to a page and a change to what a page is
# allowed to load can travel together.
#
# nginx drops inherited add_header directives as soon as a location sets one
# of its own, so these are included per-location rather than set once.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
# style-src 'self': the stylesheet is a file at /style.<hash>.css, not a copy
# in the head of every page, and under default-src 'none' a linked stylesheet
# needs saying so — without it the browser fetches the file, all 200 and
# text/css, and then applies none of it. 'unsafe-inline' stays for the
# one-page edition, which still carries its own <style>.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
