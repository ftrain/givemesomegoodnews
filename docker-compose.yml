# Postgres with pgvector, for running givemesomegoodnews without a local install.
# Start it, then: export DATABASE_URL=postgresql://givemesomegoodnews:givemesomegoodnews@localhost:5433/givemesomegoodnews
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: givemesomegoodnews
      POSTGRES_USER: givemesomegoodnews
      POSTGRES_PASSWORD: givemesomegoodnews
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
