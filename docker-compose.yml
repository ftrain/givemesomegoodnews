# Postgres with pgvector, for running localpaper without a local install.
# Start it, then: export DATABASE_URL=postgresql://localpaper:localpaper@localhost:5433/localpaper
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: localpaper
      POSTGRES_USER: localpaper
      POSTGRES_PASSWORD: localpaper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
